; NOAR UE5 Digital Apartment - DefaultGameplayTags.ini
; Standard v1.1, section 8. Native declarations in Source/NOARCore/NOARGameplayTags.h keep C++ and BP in sync.
; Apartment zones beyond Dempster are added per apartment in Config/Tags/<APT>.ini (same syntax).

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
AllowEditorTagUnloading=True
AllowGameTagUnloading=False
FastReplication=False
InvalidTagCharacters="\"',"
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

; ---- Interaction state machine ----
+GameplayTagList=(Tag="Interact.State.Closed",DevComment="Mechanism fully closed")
+GameplayTagList=(Tag="Interact.State.Opening",DevComment="Timeline playing forward")
+GameplayTagList=(Tag="Interact.State.Open",DevComment="Mechanism fully open")
+GameplayTagList=(Tag="Interact.State.Closing",DevComment="Timeline reversing")

; ---- Why CanInteract failed ----
+GameplayTagList=(Tag="Interact.Lock.Locked",DevComment="Locked by design (mech room door, wine cooler)")
+GameplayTagList=(Tag="Interact.Lock.Dependency",DevComment="RequiredOpen[] not satisfied: outer door first")
+GameplayTagList=(Tag="Interact.Lock.Blocked",DevComment="BlockedBy[]: neighbouring part is open in the path")

; ---- Mechanism type ----
+GameplayTagList=(Tag="Interact.Type.Door",DevComment="Hinged (CLIP top, interior doors, fridge)")
