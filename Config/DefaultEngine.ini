[/Script/Engine.RendererSettings]
; --- Global illumination / reflections: Lumen only, no Lightmass ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.HardwareRayTracing=False
r.RayTracing=True
r.RayTracing.Shadows=False
r.Lumen.Reflections.Allow=1
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DistanceFields.DefaultVoxelDensity=0.2
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True

; --- Shadows ---
r.Shadow.Virtual.Enable=1

; --- Geometry ---
r.Nanite.ProjectEnabled=True

; --- Path / AA / exposure ---
r.ForwardShading=False
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.LensFlare=False
r.VRS=0

; --- Substrate: ON for 5.8 (Blendable GBuffer is the default for new projects, parity with legacy).
;     Adaptive GBuffer is an optional hero profile after profiling, never the default.
r.Substrate=True

; --- Textures ---
r.VirtualTextures=True
r.VT.TileSize=128
r.VT.TileBorderSize=4
r.VirtualTexturedLightmaps=False
r.TextureStreaming=True

; --- Misc ---
r.CustomDepth=3
r.SkinCache.CompileShaders=True
r.PSOPrecaching=1
r.ShaderPipelineCache.Enabled=1
r.MSAACount=1
r.GPUSkin.Support16BitBoneIndex=True
r.Mobile.AntiAliasing=0
r.ReflectionCaptureResolution=256

[/Script/Engine.CollisionProfile]
