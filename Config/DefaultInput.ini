; NOAR UE5 Digital Apartment - DefaultInput.ini
; Enhanced Input only. Mapping contexts live as assets:
;   /Game/NOAR/Input/IMC_NOAR_Walk   (WASD, RMB+mouse look in 3P, mouse look in 1P, E/LMB interact, Shift fast walk,
;                                     V camera mode, F photo mode, Tab finishes, M rooms, N day/night, Esc menu, wheel zoom)
;   /Game/NOAR/Input/IMC_NOAR_UI     (cursor, Esc/Tab close)
;   /Game/NOAR/Input/IMC_NOAR_Photo  (free camera, H hide UI, Space capture, Esc exit)
; Gamepad bindings are in the same contexts (section 11).

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=True
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
DefaultViewportMouseLockMode=DoNotLock
bCaptureMouseOnLaunch=False
bEnableLegacyInputScales=False
-AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.25,Exponent=1.f,Sensitivity=1.f))
-AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.25,Exponent=1.f,Sensitivity=1.f))
-AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.25,Exponent=1.f,Sensitivity=1.f))
-AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.25,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.25,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.25,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.25,Exponent=1.5f,Sensitivity=0.6f))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.25,Exponent=1.5f,Sensitivity=0.6f))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.06f))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.06f))
ConsoleKeys=Tilde

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableDefaultMappingContexts=True
bShouldLogAllWorldSubsystemInputs=False
