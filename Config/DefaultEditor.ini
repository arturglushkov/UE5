; NOAR UE5 Digital Apartment - DefaultEditor.ini

[/Script/UnrealEd.EditorEngine]
; Lumen / Nanite scenes: keep PIE in a separate window at client resolution to judge the look honestly
PlayInEditorWindowSize=(X=1920,Y=1080)

[/Script/UnrealEd.EditorPerProjectUserSettings]
bDisplayUIExtensionPoints=False

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Scripts/Editor is on the Python path so `import noar_validate_export` works from the Output Log
+AdditionalPaths=(Path="Scripts/Editor")
bDeveloperMode=False

[/Script/UnrealEd.LevelEditorPlaySettings]
NewWindowWidth=1920
NewWindowHeight=1080
PlayNetMode=PIE_Standalone
