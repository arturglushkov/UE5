; NOAR UE5 Digital Apartment - DefaultScalability.ini
; Standard v1.1, section 13.
;
; NOAR tiers map onto engine scalability levels:
;   NOAR_LOW    = 1   (30 fps, laptops / Mac M1)
;   NOAR_MEDIUM = 2   (30 fps, Mac M2/M3 Max; Lumen Lite: Irradiance Final Gather + SSR reflections)
;   NOAR_HIGH   = 3   (60 fps 1440p, client PC RTX 4060-4070)  <- client default
;   NOAR_ULTRA  = 4   (60 fps 4K, RTX 4080/4090; HWRT via Windows device profile)
; Level 0 (Low) stays as engine default and is never offered in the UI.
; Photo mode temporarily forces level 4 for ReflectionQuality and ShadowQuality.
;
; Every number here is a START value. Gate 4 on LS_PerfRoute decides the final ones.

[ScalabilitySettings]
; Synth Benchmark auto-detect: GPU index thresholds for levels 1 | 2 | 3 | 4
PerfIndexThresholds_ResolutionQuality="GPU 150 300 550"
PerfIndexThresholds_ViewDistanceQuality="GPU 150 300 550"
PerfIndexThresholds_AntiAliasingQuality="GPU 150 300 550"
PerfIndexThresholds_ShadowQuality="GPU 150 300 550"
PerfIndexThresholds_GlobalIlluminationQuality="GPU 150 300 550"
PerfIndexThresholds_ReflectionQuality="GPU 150 300 550"
PerfIndexThresholds_PostProcessQuality="GPU 150 300 550"
PerfIndexThresholds_TextureQuality="GPU 150 300 550"
PerfIndexThresholds_EffectsQuality="GPU 150 300 550"
PerfIndexThresholds_FoliageQuality="GPU 150 300 550"
PerfIndexThresholds_ShadingQuality="GPU 150 300 550"
PerfIndexValues_ResolutionQuality="58 67 100 100"

; ===================== GLOBAL ILLUMINATION =====================
[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.FinalGatherMethod=0
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.TraceMeshSDFs=0
r.LumenScene.Radiosity.ProbeSpacing=8
r.Lumen.MaxTraceDistance=1500

[GlobalIlluminationQuality@2]
; Lumen Lite GI (5.8): Irradiance Final Gather, roughly half the cost of standard gather
r.DynamicGlobalIlluminationMethod=1
r.Lumen.FinalGatherMethod=0
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.TraceMeshSDFs=0
r.LumenScene.Radiosity.ProbeSpacing=4
r.Lumen.MaxTraceDistance=2000

[GlobalIlluminationQuality@3]
; HIGH baseline (section 6)
r.DynamicGlobalIlluminationMethod=1
r.Lumen.FinalGatherMethod=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.TraceMeshSDFs=1
r.Lumen.TraceMeshSDFs.TraceDistance=180
r.LumenScene.Radiosity.ProbeSpacing=4
r.Lumen.MaxTraceDistance=2000

[GlobalIlluminationQuality@4]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.FinalGatherMethod=1
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=16
r.Lumen.TraceMeshSDFs=1
r.Lumen.TraceMeshSDFs.TraceDistance=180
r.LumenScene.Radiosity.ProbeSpacing=4
r.Lumen.MaxTraceDistance=2000

; ===================== REFLECTIONS =====================
[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=2
r.SSR.HalfResSceneColor=1

[ReflectionQuality@2]
; Lumen Lite reflections (5.8): Lumen Reflections off, SSR on smooth surfaces, rough specular from GI.
; Photo mode switches to level 4 for the frame.
r.Lumen.Reflections.Allow=0
r.SSR.Quality=3
r.SSR.HalfResSceneColor=0

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.4
r.Lumen.Reflections.SmoothThreshold=0.1

[ReflectionQuality@4]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.6
r.Lumen.Reflections.SmoothThreshold=0.05
; HWRT hit lighting is enabled only by the Windows device profile (DefaultDeviceProfiles.ini)

; ===================== SHADOWS (VSM) =====================
[ShadowQuality@1]
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.ResolutionLodBiasLocal=1.5
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=2
r.Shadow.Virtual.SMRT.RayCountLocal=4
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=2
r.Shadow.Virtual.MaxPhysicalPages=2048

[ShadowQuality@2]
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.ResolutionLodBiasLocal=0.5
r.Shadow.Virtual.SMRT.RayCountDirectional=6
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=3
r.Shadow.Virtual.SMRT.RayCountLocal=6
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=3
r.Shadow.Virtual.MaxPhysicalPages=3072

[ShadowQuality@3]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=0.5
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=6
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=3
r.Shadow.Virtual.MaxPhysicalPages=4096

[ShadowQuality@4]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.SMRT.RayCountDirectional=16
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=8
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4
r.Shadow.Virtual.MaxPhysicalPages=8192

; ===================== TEXTURES =====================
[TextureQuality@1]
r.Streaming.MipBias=1
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=4

[TextureQuality@2]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8

[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8

[TextureQuality@4]
r.Streaming.MipBias=0
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16

; ===================== POST PROCESS =====================
[PostProcessQuality@1]
r.MotionBlurQuality=0
r.BloomQuality=4
r.Tonemapper.Quality=3
r.LocalExposure.Enabled=1 ; local exposure is part of the look, never off

[PostProcessQuality@2]
r.MotionBlurQuality=3
r.BloomQuality=5
r.Tonemapper.Quality=5
r.LocalExposure.Enabled=1

[PostProcessQuality@3]
r.MotionBlurQuality=4
r.BloomQuality=5
r.Tonemapper.Quality=5
r.LocalExposure.Enabled=1

[PostProcessQuality@4]
r.MotionBlurQuality=4
r.BloomQuality=5
r.Tonemapper.Quality=5
r.LocalExposure.Enabled=1

; ===================== ANTI-ALIASING (TSR) =====================
[AntiAliasingQuality@1]
r.TSR.History.ScreenPercentage=100
r.TSR.ShadingRejection.Flickering=0

[AntiAliasingQuality@2]
r.TSR.History.ScreenPercentage=100
r.TSR.ShadingRejection.Flickering=1

[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=200
r.TSR.ShadingRejection.Flickering=1

[AntiAliasingQuality@4]
r.TSR.History.ScreenPercentage=200
r.TSR.ShadingRejection.Flickering=1

; ===================== VIEW DISTANCE / SHADING (apartment is 20 m, keep max) =====================
[ViewDistanceQuality@1]
r.ViewDistanceScale=1.0
[ViewDistanceQuality@2]
r.ViewDistanceScale=1.0
[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0
[ViewDistanceQuality@4]
r.ViewDistanceScale=1.0

[ShadingQuality@1]
r.HairStrands.SkyLighting=0
[ShadingQuality@2]
r.HairStrands.SkyLighting=0
[ShadingQuality@3]
r.HairStrands.SkyLighting=1
[ShadingQuality@4]
r.HairStrands.SkyLighting=1
