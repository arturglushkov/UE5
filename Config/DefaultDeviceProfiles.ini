; NOAR UE5 Digital Apartment - DefaultDeviceProfiles.ini
; One project, two targets. All platform differences live here, never in branches.
; Texture pool values are START values (section 13) - validate with `stat streaming` on each machine.

[Windows DeviceProfile]
DeviceType=Windows
BaseProfileName=
+CVars=r.Streaming.PoolSize=4000
+CVars=r.ScreenPercentage=100
+CVars=r.Lumen.Reflections.DownsampleFactor=1
; Hardware Lumen is opt-in per quality level 4 (NOAR_ULTRA) on RTX; see BP_NOAR_GameInstance::ApplyQuality.
; Keep it off by default so a 4060 on HIGH never pays for it.
+CVars=r.Lumen.HardwareRayTracing=0
+CVars=r.Lumen.HardwareRayTracing.LightingMode=0

[Mac DeviceProfile]
DeviceType=Mac
BaseProfileName=
+CVars=r.Streaming.PoolSize=2500
+CVars=r.ScreenPercentage=75
+CVars=r.Lumen.Reflections.DownsampleFactor=2
; Software Lumen is the Mac production baseline. HWRT / MegaLights on Apple Silicon M2+ are EXPERIMENTAL in 5.8:
; they live in Config/NOAR_MAC_EXPERIMENTAL.ini (loaded manually with -ExecCmds), never in a client build.
+CVars=r.Lumen.HardwareRayTracing=0
+CVars=r.MegaLights.Allowed=0
+CVars=r.Nanite.MaxPixelsPerEdge=1.5

; ---- Profiles used for scheduled benchmark runs (LS_PerfRoute), selected with -DeviceProfile=<name> ----
[NOAR_ClientStandardPC DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=sg.ResolutionQuality=100
+CVars=t.MaxFPS=60

[NOAR_HighEndRTX DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=r.Streaming.PoolSize=6000
+CVars=r.Lumen.HardwareRayTracing=1
+CVars=r.Lumen.HardwareRayTracing.LightingMode=2
+CVars=r.Lumen.Reflections.HardwareRayTracing=1
+CVars=t.MaxFPS=60

[NOAR_DevMac DeviceProfile]
DeviceType=Mac
BaseProfileName=Mac
+CVars=sg.ResolutionQuality=67
+CVars=t.MaxFPS=30
